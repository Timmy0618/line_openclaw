services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    # bridge 網路：vLLM 跑在 host 上，用 host.docker.internal 連（見 openclaw.json baseUrl）。
    # gateway 綁容器內 loopback:19001，bridge 靠 docker exec 跑 CLI，不需發佈埠。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.openclaw:/home/node/.openclaw
    environment:
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - VLLM_API_KEY=${VLLM_API_KEY:-vllm-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:19001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  line-bridge:
    build:
      context: ./line_bridge
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.openclaw:/readonly-openclaw:ro
    environment:
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - OPENCLAW_CONTAINER=${COMPOSE_PROJECT_NAME:-line_openclaw}-openclaw-1
      - OPENCLAW_TIMEOUT_SECONDS=${OPENCLAW_TIMEOUT_SECONDS:-25}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - ALLOWED_GROUP_IDS=${ALLOWED_GROUP_IDS:-}
    depends_on:
      openclaw:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # bridge 網路：openclaw 用 service name searxng:8080 連（見 openclaw.json searxng baseUrl）
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./searxng:/etc/searxng

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://line-bridge:8000
    depends_on:
      line-bridge:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel
